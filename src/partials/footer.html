<script>
(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // hero waveform bars
  var hw = document.getElementById('heroWave');
  if (hw) { for (var i=0;i<56;i++){ var s=document.createElement('span'); if(!reduce){ s.style.animationDelay=(-(Math.random()*1.1)).toFixed(2)+'s'; s.style.animationDuration=(0.7+Math.random()*0.8).toFixed(2)+'s'; } else { s.style.height=(20+Math.random()*60)+'%'; } hw.appendChild(s);} }

  // cursor-tracked glow
  if (!reduce) { window.addEventListener('pointermove', function(e){ document.documentElement.style.setProperty('--mx', e.clientX+'px'); document.documentElement.style.setProperty('--my', e.clientY+'px'); }, {passive:true}); }

  // configurator (only on pages that still carry it; guarded so its absence never breaks the rest)
  var chips=document.getElementById('cfgChips'), feed=document.getElementById('cfgFeed'), title=document.getElementById('cfgTitle'), note=document.getElementById('cfgNote');
  if (chips && feed && title && note) {
    var trades = [
      { k:'HVAC', t:'Tulsa Air · sample call', feed:[['them','My AC stopped working, it’s 95 in here.'],['ai','I’m sorry, that’s urgent. I can dispatch a tech today between 1 and 3.'],['them','Yes please.'],['ai','Done. A tech is on the way and your cell is on file.']] },
      { k:'Plumber', t:'Reliable Plumbing · sample call', feed:[['them','Water heater’s leaking, can someone come out?'],['ai','Yes. I can have a plumber out tomorrow morning, 8 to 10.'],['them','Great, book it.'],['ai','You’re scheduled. We’ll call 30 minutes before arrival.']] }
    ];
    var notes={'HVAC':'Emergencies routed to your cell, everything else booked.','Plumber':'Urgent jobs triaged, routine work scheduled around your route.'};
    var timer=null;
    function render(tr){
      title.textContent=tr.t; note.textContent=notes[tr.k]||'';
      feed.innerHTML=''; if(timer) clearTimeout(timer);
      var i=0;
      (function add(){
        if(i>=tr.feed.length) return;
        var b=document.createElement('div'); b.className='bubble '+(tr.feed[i][0]==='ai'?'b-ai':'b-them'); b.textContent=tr.feed[i][1]; feed.appendChild(b);
        requestAnimationFrame(function(){requestAnimationFrame(function(){b.classList.add('show');});});
        i++; timer=setTimeout(add, reduce?260:760);
      })();
    }
    trades.forEach(function(tr,idx){ var c=document.createElement('button'); c.className='chip'; c.type='button'; c.textContent=tr.k; c.setAttribute('aria-pressed', idx===0?'true':'false'); c.onclick=function(){ chips.querySelectorAll('.chip').forEach(function(x){x.setAttribute('aria-pressed','false');}); c.setAttribute('aria-pressed','true'); render(tr); }; chips.appendChild(c); });
    render(trades[0]);
  }

  // scroll-progress signal bar
  var prog=document.querySelector(".scroll-prog");
  function onScroll(){ if(!prog)return; var h=document.documentElement; var p=h.scrollTop/((h.scrollHeight-h.clientHeight)||1); prog.style.width=(Math.max(0,Math.min(1,p))*100).toFixed(1)+"%"; }
  window.addEventListener("scroll",onScroll,{passive:true}); onScroll();
  var tl=document.getElementById("timeline");
  if(tl){ if(reduce||!("IntersectionObserver" in window)){ tl.classList.add("lit"); } else { var tio=new IntersectionObserver(function(es){es.forEach(function(e){ if(e.isIntersecting){ tl.classList.add("lit"); tio.disconnect(); } });},{threshold:.35}); tio.observe(tl); } }

  // scroll reveal
  if (!reduce && 'IntersectionObserver' in window) {
    document.documentElement.classList.add('js-reveal');
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('is-visible');io.unobserve(e.target);}});},{rootMargin:'0px 0px -10% 0px',threshold:.1});
    document.querySelectorAll('.reveal').forEach(function(el){io.observe(el);});
  }
})();

(function () {
  var form = document.getElementById('leadForm');
  if (!form) return;
  var API = 'https://web-production-976b9.up.railway.app/leads';
  var err = document.getElementById('lf-error');
  var btn = form.querySelector('button[type="submit"]');
  function val(n) { var el = form.querySelector('[name="' + n + '"]'); return el ? el.value.trim() : ''; }
  function fail(msg) { if (err) { err.textContent = msg; err.hidden = false; } btn.disabled = false; btn.textContent = 'Get my free audit'; }
  function track(name) { if (typeof gtag === 'function') gtag('event', name); }
  form.addEventListener('submit', function (e) {
    e.preventDefault(); if (err) err.hidden = true;
    if (val('company_url')) { window.location.href = '/thanks'; return; } // honeypot: pretend success, post nothing
    var name = val('name'), business = val('business'), trade = val('trade'), phone = val('phone'), email = val('email');
    var digits = phone.replace(/\D/g, '');
    if (!name || !business) { return fail('Add your name and your business name.'); }
    if (!trade) { return fail('Pick your trade.'); }
    if (!phone && !email) { return fail('Add a phone number or an email so we can send the audit.'); }
    if (phone && !(digits.length === 10 || (digits.length === 11 && digits.charAt(0) === '1'))) { return fail('Enter a 10-digit US phone number.'); }
    if (email && email.indexOf('@') < 0) { return fail('That email does not look right.'); }
    var needs = Array.prototype.map.call(form.querySelectorAll('input[name="needs"]:checked'), function (c) { return c.value; });
    // ponytail: page and needs ride inside `problem` so POST /leads needs no new fields; real columns when volume justifies it
    var problem = 'From: ' + window.location.pathname + '. ' + (needs.length ? 'Needs: ' + needs.join(', ') + '. ' : '') + val('problem');
    btn.disabled = true; btn.textContent = 'Sending';
    fetch(API, { method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, business: business, trade: trade, phone: phone, email: email, problem: problem, source: 'web_form' }) })
      .then(function (r) { if (!r.ok) { throw new Error('status ' + r.status); } track('form_submit'); window.location.href = '/thanks'; })
      .catch(function () { track('form_error'); fail('That did not go through. Call (918) 359-2644 and the receptionist will take your details, or email trey@kaicovoice.com.'); });
  });
})();

(function () {
  document.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('a') : null; if (!a || typeof gtag !== 'function') return;
    var h = a.getAttribute('href') || '';
    if (h.indexOf('tel:') === 0) gtag('event', 'tel_click');
    else if (h.indexOf('cal.com') > -1) gtag('event', 'cal_click');
    else if (a.classList.contains('btn-audit')) gtag('event', 'audit_cta_click');
  });
})();
</script>
